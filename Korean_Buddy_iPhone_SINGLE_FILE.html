<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827"><title>Korean Buddy</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15151d;--muted:#737482;--a:#6d5dfc;--a2:#9589ff;--line:#e9e9f0;--good:#16a06b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans",sans-serif;color:var(--text)}
.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:850}.avatar{width:42px;height:42px;border-radius:15px;background:#eeeaff;display:grid;place-items:center}.page{padding:0 20px 20px}
.hero{background:linear-gradient(135deg,#6354ef,#a194ff);color:#fff;border-radius:28px;padding:23px;box-shadow:0 14px 32px #6d5dfc2e}.hero h1{margin:8px 0 4px;font-size:28px}.hero p{margin:0 0 17px;opacity:.9}.progress{height:9px;background:#fff4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#fff;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 20px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px}.stat b{display:block;font-size:21px}.stat span,small{font-size:12px;color:var(--muted)}h2{font-size:19px;margin:22px 0 11px}
.lesson{display:flex;align-items:center;gap:13px}.icon{width:49px;height:49px;border-radius:16px;background:#f0edff;display:grid;place-items:center;font-size:23px}.lesson>div:nth-child(2){flex:1}.lesson b{display:block}.secondary{border:0;background:#efedff;color:#5041d6;padding:11px 14px;border-radius:14px;font-weight:750}.primary{width:100%;border:0;background:var(--a);color:#fff;padding:16px;border-radius:17px;font-weight:800;margin-top:14px;font-size:16px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid var(--line);z-index:10}.nav{max-width:540px;margin:auto;height:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:#858590;font-size:11px}.nav button.active{color:var(--a);font-weight:800}.nav div{font-size:21px;margin-bottom:2px}
.korean{font-size:50px;font-weight:850;margin:12px 0}.roman{font-size:16px;color:var(--muted)}.meaning{font-size:20px;font-weight:750;margin:8px}.word{text-align:center;padding:28px 18px}.audio{display:flex;gap:9px;justify-content:center;margin:20px 0}.choice{width:100%;padding:15px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;margin:8px 0}.choice.correct{border-color:var(--good);background:#effbf5}.choice.wrong{border-color:#db5d5d;background:#fff1f1}.bar{height:10px;background:#eeeef4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{aspect-ratio:1;border-radius:10px;background:#eeeef4;display:grid;place-items:center;font-size:11px}.day.done{background:var(--a);color:#fff}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#efedff;color:#5647d8;font-size:11px;font-weight:800}.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;font:inherit;margin:6px 0 12px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#18181f;color:#fff;padding:12px 18px;border-radius:99px;display:none;z-index:30;white-space:nowrap}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div>
<script>

re are you from?"}]}, {"title": "People", "icon": "👨‍👩‍👧", "items": [{"ko": "사람", "rom": "saram", "en": "Person"}, {"ko": "친구", "rom": "chingu", "en": "Friend"}, {"ko": "가족", "rom": "gajok", "en": "Family"}, {"ko": "엄마", "rom": "eomma", "en": "Mom"}, {"ko": "아빠", "rom": "appa", "en": "Dad"}]}, {"title": "Numbers 1–5", "icon": "🔢", "items": [{"ko": "하나", "rom": "hana", "en": "One"}, {"ko": "둘", "rom": "dul", "en": "Two"}, {"ko": "셋", "rom": "set", "en": "Three"}, {"ko": "넷", "rom": "net", "en": "Four"}, {"ko": "다섯", "rom": "daseot", "en": "Five"}]}, {"title": "Numbers 6–10", "icon": "🔢", "items": [{"ko": "여섯", "rom": "yeoseot", "en": "Six"}, {"ko": "일곱", "rom": "ilgop", "en": "Seven"}, {"ko": "여덟", "rom": "yeodeol", "en": "Eight"}, {"ko": "아홉", "rom": "ahop", "en": "Nine"}, {"ko": "열", "rom": "yeol", "en": "Ten"}]}, {"title": "Food", "icon": "🍜", "items": [{"ko": "밥", "rom": "bap", "en": "Rice / meal"}, {"ko": "김치", "rom": "gimchi", "en": "Kimchi"}, {"ko": "빵", "rom": "ppang", "en": "Bread"}, {"ko": "라면", "rom": "ramyeon", "en": "Ramen"}, {"ko": "채소", "rom": "chaeso", "en": "Vegetables"}]}, {"title": "Drinks", "icon": "🥤", "items": [{"ko": "물", "rom": "mul", "en": "Water"}, {"ko": "커피", "rom": "keopi", "en": "Coffee"}, {"ko": "차", "rom": "cha", "en": "Tea"}, {"ko": "우유", "rom": "uyu", "en": "Milk"}, {"ko": "주스", "rom": "juseu", "en": "Juice"}]}, {"title": "Restaurant Korean", "icon": "🍽️", "items": [{"ko": "메뉴", "rom": "menyu", "en": "Menu"}, {"ko": "맛있어요", "rom": "masisseoyo", "en": "It's delicious"}, {"ko": "매워요", "rom": "maewoyo", "en": "It's spicy"}, {"ko": "안 매워요", "rom": "an maewoyo", "en": "It's not spicy"}, {"ko": "계산해 주세요", "rom": "gyesanhae juseyo", "en": "Please bring the bill"}]}, {"title": "Shopping", "icon": "🛍️", "items": [{"ko": "얼마예요?", "rom": "eolmayeyo?", "en": "How much is it?"}, {"ko": "이거", "rom": "igeo", "en": "This"}, {"ko": "저거", "rom": "jeogeo", "en": "That"}, {"ko": "비싸요", "rom": "bissayo", "en": "It's expensive"}, {"ko": "싸요", "rom": "ssayo", "en": "It's cheap"}]}, {"title": "Directions", "icon": "🧭", "items": [{"ko": "어디예요?", "rom": "eodiyeyo?", "en": "Where is it?"}, {"ko": "화장실", "rom": "hwajangsil", "en": "Bathroom"}, {"ko": "왼쪽", "rom": "oenjjok", "en": "Left"}, {"ko": "오른쪽", "rom": "oreunjjok", "en": "Right"}, {"ko": "직진", "rom": "jikjin", "en": "Straight ahead"}]}, {"title": "Transport", "icon": "🚇", "items": [{"ko": "지하철", "rom": "jihacheol", "en": "Subway"}, {"ko": "버스", "rom": "beoseu", "en": "Bus"}, {"ko": "택시", "rom": "taeksi", "en": "Taxi"}, {"ko": "공항", "rom": "gonghang", "en": "Airport"}, {"ko": "역", "rom": "yeok", "en": "Station"}]}, {"title": "Time words", "icon": "⏰", "items": [{"ko": "오늘", "rom": "oneul", "en": "Today"}, {"ko": "내일", "rom": "naeil", "en": "Tomorrow"}, {"ko": "어제", "rom": "eoje", "en": "Yesterday"}, {"ko": "지금", "rom": "jigeum", "en": "Now"}, {"ko": "나중에", "rom": "najunge", "en": "Later"}]}, {"title": "Daily verbs", "icon": "🏃", "items": [{"ko": "가요", "rom": "gayo", "en": "Go"}, {"ko": "와요", "rom": "wayo", "en": "Come"}, {"ko": "먹어요", "rom": "meogeoyo", "en": "Eat"}, {"ko": "마셔요", "rom": "masyeoyo", "en": "Drink"}, {"ko": "봐요", "rom": "bwayo", "en": "See / watch"}]}, {"title": "Likes", "icon": "❤️", "items": [{"ko": "좋아요", "rom": "joayo", "en": "It's good / I like it"}, {"ko": "좋아해요", "rom": "joahaeyo", "en": "I like"}, {"ko": "싫어요", "rom": "sireoyo", "en": "I don't like it"}, {"ko": "사랑해요", "rom": "saranghaeyo", "en": "I love you"}, {"ko": "재미있어요", "rom": "jaemiisseoyo", "en": "It's fun"}]}, {"title": "Useful questions", "icon": "❓", "items": [{"ko": "뭐예요?", "rom": "mwoyeyo?", "en": "What is it?"}, {"ko": "누구예요?", "rom": "nuguyeyo?", "en": "Who is it?"}, {"ko": "왜요?", "rom": "waeyo?", "en": "Why?"}, {"ko": "어떻게?", "rom": "eotteoke?", "en": "How?"}, {"ko": "괜찮아요?", "rom": "gwaenchanayo?", "en": "Are you okay?"}]}, {"title": "Polite endings", "icon": "🌸", "items": [{"ko": "~요", "rom": "~yo", "en": "Polite ending"}, {"ko": "이에요", "rom": "ieyo", "en": "It is (after consonant)"}, {"ko": "예요", "rom": "yeyo", "en": "It is (after vowel)"}, {"ko": "있어요", "rom": "isseoyo", "en": "There is / have"}, {"ko": "없어요", "rom": "eopseoyo", "en": "There isn't / don't have"}]}, {"title": "Particles: 은/는", "icon": "🧠", "items": [{"ko": "저는", "rom": "jeoneun", "en": "As for me / I"}, {"ko": "저는 학생이에요", "rom": "jeoneun haksaengieyo", "en": "I am a student"}, {"ko": "오늘은", "rom": "oneureun", "en": "As for today"}, {"ko": "한국은", "rom": "hangugeun", "en": "As for Korea"}, {"ko": "이것은", "rom": "igeoseun", "en": "As for this"}]}, {"title": "Particles: 이/가", "icon": "🧠", "items": [{"ko": "비가 와요", "rom": "biga wayo", "en": "It's raining"}, {"ko": "친구가 와요", "rom": "chinguga wayo", "en": "A friend is coming"}, {"ko": "뭐가 좋아요?", "rom": "mwoga joayo?", "en": "What do you like?"}, {"ko": "누가 왔어요?", "rom": "nuga wasseoyo?", "en": "Who came?"}, {"ko": "날씨가 좋아요", "rom": "nalssiga joayo", "en": "The weather is good"}]}, {"title": "Past tense", "icon": "⏪", "items": [{"ko": "갔어요", "rom": "gasseoyo", "en": "Went"}, {"ko": "먹었어요", "rom": "meogeosseoyo", "en": "Ate"}, {"ko": "봤어요", "rom": "bwasseoyo", "en": "Saw / watched"}, {"ko": "했어요", "rom": "haesseoyo", "en": "Did"}, {"ko": "좋았어요", "rom": "joasseoyo", "en": "Was good"}]}, {"title": "Future plans", "icon": "🔮", "items": [{"ko": "갈 거예요", "rom": "gal geoyeyo", "en": "Will go"}, {"ko": "먹을 거예요", "rom": "meogeul geoyeyo", "en": "Will eat"}, {"ko": "볼 거예요", "rom": "bol geoyeyo", "en": "Will watch / see"}, {"ko": "할 거예요", "rom": "hal geoyeyo", "en": "Will do"}, {"ko": "만날 거예요", "rom": "mannal geoyeyo", "en": "Will meet"}]}, {"title": "Mini conversation 1", "icon": "💬", "items": [{"ko": "안녕하세요", "rom": "annyeonghaseyo", "en": "Hello"}, {"ko": "이름이 뭐예요?", "rom": "ireumi mwoyeyo?", "en": "What is your name?"}, {"ko": "저는 ___예요", "rom": "jeoneun ___yeyo", "en": "I am ___"}, {"ko": "만나서 반가워요", "rom": "mannaseo bangawoyo", "en": "Nice to meet you"}, {"ko": "저도 반가워요", "rom": "jeodo bangawoyo", "en": "Nice to meet you too"}]}, {"title": "Mini conversation 2", "icon": "💬", "items": [{"ko": "뭐 해요?", "rom": "mwo haeyo?", "en": "What are you doing?"}, {"ko": "공부해요", "rom": "gongbuhaeyo", "en": "I study"}, {"ko": "일해요", "rom": "ilhaeyo", "en": "I work"}, {"ko": "쉬어요", "rom": "swieoyo", "en": "I rest"}, {"ko": "같이 가요", "rom": "gachi gayo", "en": "Let's go together"}]}, {"title": "Travel survival", "icon": "✈️", "items": [{"ko": "도와주세요", "rom": "dowajuseyo", "en": "Please help me"}, {"ko": "영어 할 수 있어요?", "rom": "yeongeo hal su isseoyo?", "en": "Can you speak English?"}, {"ko": "천천히 말해 주세요", "rom": "cheoncheonhi malhae juseyo", "en": "Please speak slowly"}, {"ko": "다시 말해 주세요", "rom": "dasi malhae juseyo", "en": "Please say it again"}, {"ko": "괜찮습니다", "rom": "gwaenchanseumnida", "en": "It's okay (formal)"}]}, {"title": "Review challenge", "icon": "🏆", "items": [{"ko": "한국어", "rom": "hangugeo", "en": "Korean language"}, {"ko": "한국", "rom": "hanguk", "en": "Korea"}, {"ko": "친구", "rom": "chingu", "en": "Friend"}, {"ko": "맛있어요", "rom": "masisseoyo", "en": "It's delicious"}, {"ko": "화이팅!", "rom": "hwaiting!", "en": "You can do it!"}]}];
let s=JSON.parse(localStorage.koreanBuddyV2||"null")||{xp:0,streak:0,learned:0,done:[],days:[],mistakes:[],lastDate:null};
function save(){localStorage.koreanBuddyV2=JSON.stringify(s)}
function today(){return new Date().toISOString().slice(0,10)}
function speak(t,slow=false){if(!window.speechSynthesis){toast("Korean audio is not available in this browser.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=slow?.55:.82;let v=speechSynthesis.getVoices().find(x=>x.lang?.toLowerCase().startsWith("ko"));if(v)u.voice=v;speechSynthesis.speak(u)}
function markDay(){let d=today();if(!s.days.includes(d))s.days.push(d);if(s.lastDate!==d){let y=new Date(Date.now()-86400000).toISOString().slice(0,10);s.streak=s.lastDate===y?s.streak+1:1;s.lastDate=d}save()}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1700)}
function nav(a){return `<div class="bottom"><div class="nav">
<button class="${a=="home"?"active":""}" onclick="home()">🏠<div>Home</div></button>
<button class="${a=="learn"?"active":""}" onclick="learn()">📚<div>Learn</div></button>
<button class="${a=="play"?"active":""}" onclick="quiz()">🎮<div>Play</div></button>
<button class="${a=="progress"?"active":""}" onclick="progress()">📊<div>Progress</div></button></div></div>`}
function home(){let pct=Math.round(s.learned/(lessons.length*5)*100);document.getElementById("app").innerHTML=`<div class="top"><div class="brand">🇰🇷 Korean Buddy</div><div class="avatar">😊</div></div><div class="page">
<div class="hero"><span class="pill" style="background:#fff3;color:#fff">BEGINNER</span><h1>안녕하세요! 👋</h1><p>5 minutes today is enough to keep moving.</p><div class="progress"><i style="width:${pct}%"></i></div><small style="color:#fff">${pct}% of your starter course</small></div>
<div class="stats"><div class="stat"><b>🔥 ${s.streak}</b><span>Day streak</span></div><div class="stat"><b>⭐ ${s.xp}</b><span>XP</span></div><div class="stat"><b>📚 ${s.learned}</b><span>Learned</span></div></div>
<h2>Today's mission</h2><div class="card lesson"><div class="icon">🎯</div><div><b>Learn 5 Korean words</b><small>Listen → repeat → remember</small></div></div><button class="primary" onclick="start()">Start today's lesson</button>
<h2>Your journey</h2><div class="card"><b>🇰🇷 Native-style listening practice</b><p style="color:var(--muted);margin-bottom:0">Korean audio is requested as ko-KR. When a Korean voice is installed on iPhone, the app selects it automatically.</p></div>
</div>${nav("home")}`}
function learn(filter=""){let rows=lessons.map((l,i)=>({l,i})).filter(x=>x.l.title.toLowerCase().includes(filter.toLowerCase()));document.getElementById("app").innerHTML=`<div class="top"><div class="brand">📚 Learn</div></div><div class="page"><input class="search" placeholder="Search lessons..." oninput="learn(this.value)" value="${filter}">${rows.map(x=>`<div class="card lesson" style="margin:9px 0"><div class="icon">${x.l.icon}</div><div><b>${x.i+1}. ${x.l.title}</b><small>5 words · 5–8 min</small></div><button class="secondary" onclick="lesson(${x.i})">${s.done.includes(x.i)?"Review":"Start"}</button></div>`).join("")}</div>${nav("learn")}`}
function start(){let i=s.done.length<lessons.length?s.done.length:0;lesson(i)}
function lesson(i){let l=lessons[i],n=0;function render(){let x=l.items[n];document.getElementById("app").innerHTML=`<div class="top"><button class="secondary" onclick="learn()">← Back</button><span class="pill">${n+1}/${l.items.length}</span></div><div class="page"><div class="card word"><div style="font-size:34px">${l.icon}</div><div class="korean">${x.ko}</div><div class="roman">${x.rom}</div><div class="meaning">${x.en}</div><div class="audio"><button class="secondary" onclick='speak(${JSON.stringify(x.ko)})'>🔊 Listen</button><button class="secondary" onclick='speak(${JSON.stringify(x.ko)},true)'>🐢 Slow</button></div><p style="color:var(--muted)">Listen first, then repeat aloud. Romanization is a learning aid—not a replacement for Hangul.</p><button class="primary" onclick="next()">I learned this →</button></div></div>`}
function next(){s.xp+=10;s.learned=Math.min(lessons.length*5,s.learned+1);if(n===l.items.length-1&&!s.done.includes(i)){s.done.push(i);s.xp+=30;markDay();toast("Lesson complete! +30 bonus XP 🎉")}else save();if(n<l.items.length-1){n++;render()}else setTimeout(home,850)}render()}
function quiz(){let pool=lessons.flatMap(l=>l.items),q=pool[Math.floor(Math.random()*pool.length)],opts=[q.en];while(opts.length<4){let z=pool[Math.floor(Math.random()*pool.length)].en;if(!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);document.getElementById("app").innerHTML=`<div class="top"><div class="brand">🎮 Quick Challenge</div></div><div class="page"><div class="card"><span class="pill">+20 XP</span><div class="word"><div class="korean" style="font-size:44px">${q.ko}</div><p style="color:var(--muted)">What does this mean?</p></div>${opts.map(o=>`<button class="choice" onclick="answer(this,${JSON.stringify(o)},${JSON.stringify(q.en)})">${o}</button>`).join("")}<button class="secondary" style="width:100%;margin-top:10px" onclick='speak(${JSON.stringify(q.ko)})'>🔊 Hear Korean</button></div></div>${nav("play")}`}
function answer(el,a,c){document.querySelectorAll(".choice").forEach(x=>x.disabled=true);if(a===c){el.classList.add("correct");s.xp+=20;toast("Correct! +20 XP ⭐")}else{el.classList.add("wrong");s.mistakes.push(c);toast("Almost! Review it again 💪")}save()}
function progress(){let pct=Math.round(s.learned/(lessons.length*5)*100),days=Array.from({length:21},(_,i)=>`<div class="day ${s.days.length>i?'done':''}">${i+1}</div>`).join("");document.getElementById("app").innerHTML=`<div class="top"><div class="brand">📊 Progress</div></div><div class="page"><div class="card"><h2 style="margin-top:0">Starter course</h2><div style="display:flex;justify-content:space-between"><b>${pct}%</b><span style="color:var(--muted)">${s.learned}/150</span></div><div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div></div><div class="stats"><div class="stat"><b>${s.xp}</b><span>XP</span></div><div class="stat"><b>${s.streak}</b><span>Streak</span></div><div class="stat"><b>${s.done.length}/30</b><span>Lessons</span></div></div><h2>Daily activity</h2><div class="card"><div class="daygrid">${days}</div></div><h2>Achievements</h2><div class="card">🏅 ${s.learned>=5?"5 words learned":"Learn 5 words"}<br><br>🔥 ${s.streak>=7?"7-day streak achieved":"Reach a 7-day streak"}<br><br>📚 ${s.done.length>=10?"10 lessons completed":"Complete 10 lessons"}<br><br>🏆 ${s.done.length===30?"Starter course complete!":"Finish all 30 lessons"}</div></div>${nav("progress")}`}
home();
</script></body></html>
